name: Bot de inmuebles

on:
  schedule:
    # Horario en UTC. 12:05 y 22:05 UTC = 9:05 y 19:05 en Uruguay.
    - cron: "5 12,22 * * *"
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write         # para guardar seen.json en el repositorio

concurrency:
  group: bot-inmuebles
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Buscar inmuebles y avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Guardar avisos ya vistos
        if: always()
        run: |
          if [ -f seen.json ]; then
            git config user.name "bot-inmuebles"
            git config user.email "bot-inmuebles@users.noreply.github.com"
            git add seen.json
            git diff --cached --quiet || git commit -m "Actualizar avisos vistos"
            # Si mientras corría se subieron cambios, primero los trae.
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 5
            done
          fi
