name: Revisión diaria

on:
  # La dispara todos los días a las 9:00 un despertador externo (cron-job.org),
  # porque los horarios programados de GitHub se atrasan horas.
  workflow_dispatch: {}
  # Respaldo por si el despertador falla: GitHub la corre cuando puede después
  # del mediodía; si la revisión del día ya se hizo, no hace nada.
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: write

concurrency:
  group: bot-inmuebles
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Revisar inmuebles y remates
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python diario.py

      - name: Guardar memoria
        if: always()
        run: |
          git config user.name "bot-inmuebles"
          git config user.email "bot-inmuebles@users.noreply.github.com"
          git add -A seen.json remates_seen.json ultima_revision.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Revisión diaria"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done
