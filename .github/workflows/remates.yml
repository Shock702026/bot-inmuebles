name: Bot de remates

on:
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write         # para guardar remates_seen.json

concurrency:
  group: bot-inmuebles    # no corre al mismo tiempo que el bot de inmuebles
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Buscar remates y avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python remates.py

      - name: Guardar remates ya avisados
        if: always()
        run: |
          if [ -f remates_seen.json ]; then
            git config user.name "bot-inmuebles"
            git config user.email "bot-inmuebles@users.noreply.github.com"
            git add remates_seen.json
            git diff --cached --quiet || git commit -m "Actualizar remates avisados"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 5
            done
          fi
