# ==========================================================
#  Configuración del bot de inmuebles
#  Editá este archivo para cambiar lo que busca el bot.
# ==========================================================

filtros:
  precio_max_usd: 230000      # precio máximo en dólares
  # Precio máximo anterior: los avisos ya vistos entre este valor y el nuevo
  # se vuelven a revisar una vez (para no perder los que antes quedaban afuera).
  precio_max_anterior_usd: 200000
  dormitorios_min: 2          # mínimo de dormitorios (Montevideo y Maldonado)
  # Si ni la tarjeta ni la ficha dicen los dormitorios, ¿avisar igual? (false = no)
  avisar_si_no_indica_dormitorios: false
  # Departamentos donde la propiedad TIENE que tener garage o cochera.
  # El bot lo verifica entrando a la ficha de cada aviso nuevo.
  garage_obligatorio_en:
    - montevideo
  # Si la ficha no dice nada sobre garage, ¿avisar igual? (true = sí)
  avisar_si_no_indica_garage: true
  # Cotización aproximada para avisos publicados en pesos uruguayos
  cotizacion_usd_uyu: 40

# Tipos de inmueble a buscar en cada departamento: casas, apartamentos
tipos_por_depto:
  montevideo:
    - casas
    - apartamentos
  maldonado:
    - casas                   # en Maldonado solo casas

# ----------------------------------------------------------
#  Zonas por departamento.
#  - Escribí los barrios/zonas con su nombre normal (con o sin tildes).
#  - Lista vacía [] = todo el departamento.
# ----------------------------------------------------------
zonas:
  montevideo:
    - Parque Rodó
    - Cordón Sur
    - Barrio Sur
    - Palermo
    - Prado
    - Atahualpa
    - Reducto
    - Pocitos
    - Punta Carretas
  maldonado:
    - Punta del Este
    - Punta Ballena
    - Lausana
    - Chihuahua
    - Portezuelo
    - Sauce de Portezuelo
    - Solanas
    - Laguna del Sauce
    - Ocean Park

# Portales donde buscar (borrá una línea para dejar de usar ese portal)
portales:
  - casasymas
  - infocasas
  - gallito
  - remax
  - pbi            # Punta Ballena Inmobiliaria

# Máximo de avisos que se mandan por Telegram en cada revisión.
# Si hay más, el resto llega en la revisión siguiente.
max_mensajes_por_ejecucion: 25

# ----------------------------------------------------------
#  (Opcional) Búsquedas extra con URLs copiadas del navegador.
#  Útil si un portal usa otro nombre para un barrio.
#  Formato:
#    gallito:
#      - https://www.gallito.com.uy/...
# ----------------------------------------------------------
busquedas_extra: {}
